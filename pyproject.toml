
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnnx"
version = "1.0.0"
description = "ONNX graph workbench for visualization, AIMET analysis, and graph editing."
license = "MIT"
authors = [
    { name = "Jonghyuk Park", email = "hyukize@users.noreply.github.com" }
]
keywords = [
    "onnx", "aimet", "quantization", "mixed precision", "graphsurgeon",
    "machine learning", "deep learning", "neural network", "visualizer", "editor"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization"
]

[project.urls]
homepage = "https://github.com/hyukize/HNNX"

[project.readme]
text = """
HNNX is an ONNX graph workbench for model inspection, AIMET quantization
analysis and NVIDIA ONNX GraphSurgeon-backed editing.
"""
content-type = "text/markdown"

[project.scripts]
hnnx = "netron:main"

[tool.setuptools]
package-dir = { "netron" = "netron" }

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
netron = ["*.*"]

[tool.setuptools.exclude-package-data]
netron = ["app.js", "electron.*"]

[tool.ruff]
lint.select = ["B", "E", "F", "I", "UP", "W", "Q"]
cache-dir = "./dist/lint/.ruff_cache"
extend-exclude = ["vscode-extension/media"]
