name: HNNX CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm run install

      - name: Install Python quality tools
        run: python3 -m pip install ruff==0.16.1

      - name: Run JavaScript and Python static analysis
        run: npm run lint

      - name: Run graph layout regression tests
        run: npm run test:layout

      - name: Run VS Code extension tests
        run: npm --prefix vscode-extension test

      - name: Build browser application
        run: node package.js build web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run HNNX browser regression tests
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/hnnx-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npx playwright test --config=test/aimet.playwright.config.js --workers=1

  vscode-package:
    name: VS Code package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15'

      - name: Install project dependencies
        run: npm run install

      - name: Build VSIX
        run: npm run build:vscode-hnnx

      - name: Inspect VSIX
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix="vscode-extension/hnnx-${version}.vsix"
          test -f "$vsix"
          unzip -t "$vsix"
          unzip -p "$vsix" extension/package.json | grep "\"version\": \"${version}\""
          unzip -l "$vsix" | grep 'extension/media/icon.png'
          unzip -l "$vsix" | grep 'extension/media/onnx.js'
          if unzip -Z1 "$vsix" | grep -q 'extension/media/tflite.js'; then
            echo 'VSIX unexpectedly contains non-ONNX model loaders.' >&2
            exit 1
          fi

  linux-desktop:
    name: Linux desktop smoke and package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15'

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm run install

      - name: Install Electron runtime libraries
        shell: bash
        run: |
          npx playwright install-deps chromium
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-0
          else
            apt-get update
            apt-get install -y libgtk-3-0
          fi

      - name: Validate Electron runtime
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron -e \
            "if (!process.versions.electron) process.exit(1); console.log('Electron ' + process.versions.electron)"

      - name: Run Linux Electron smoke test
        shell: bash
        env:
          ELECTRON_DISABLE_GPU: '1'
        run: xvfb-run -a npx playwright test --config=test/playwright.config.js --project=desktop --workers=1

      - name: Build Linux AppImage and deb
        run: npm run build:linux-hnnx

      - name: Inspect Linux packages
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          appimage="dist/HNNX-${version}-x64.AppImage"
          deb="dist/HNNX-${version}-x64.deb"
          test -f "$appimage"
          test -f "$deb"
          test -f dist/linux-unpacked/resources/app.asar.unpacked/source/onnx-graphsurgeon.py
          file "$appimage" | grep 'x86-64'
          file "$deb" | grep 'Debian binary package'
