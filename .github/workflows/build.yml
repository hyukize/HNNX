name: HNNX CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      github-host: ${{ steps.ci-host.outputs.github-host }}

    steps:
      - name: Detect CI host
        id: ci-host
        shell: bash
        run: |
          if [ "${GITHUB_SERVER_URL:-}" = "https://github.com" ]; then
            echo "github-host=true" >> "$GITHUB_OUTPUT"
          else
            echo "github-host=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm run install

      - name: Install Python quality tools
        run: python3 -m pip install ruff==0.16.1

      - name: Run JavaScript and Python static analysis
        run: npm run lint

      - name: Run VS Code extension tests
        run: npm --prefix vscode-extension test

      - name: Build browser application
        run: node package.js build web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run HNNX browser regression tests
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/hnnx-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npx playwright test --config=test/aimet.playwright.config.js --workers=1

  vscode-package:
    name: VS Code package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install project dependencies
        run: npm run install

      - name: Build VSIX
        run: npm run build:vscode-hnnx

      - name: Inspect VSIX
        shell: bash
        run: |
          test -f vscode-extension/hnnx-0.1.15.vsix
          unzip -t vscode-extension/hnnx-0.1.15.vsix
          unzip -p vscode-extension/hnnx-0.1.15.vsix extension/package.json | grep '"version": "0.1.15"'
          unzip -l vscode-extension/hnnx-0.1.15.vsix | grep 'extension/media/icon.png'

  linux-desktop:
    name: Linux desktop smoke and package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm run install

      - name: Install Electron runtime libraries
        shell: bash
        run: |
          npx playwright install-deps chromium
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-0
          else
            apt-get update
            apt-get install -y libgtk-3-0
          fi

      - name: Validate Electron runtime
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron -e \
            "if (!process.versions.electron) process.exit(1); console.log('Electron ' + process.versions.electron)"

      - name: Run Linux Electron smoke test
        shell: bash
        env:
          ELECTRON_DISABLE_GPU: '1'
        run: xvfb-run -a npx playwright test --config=test/playwright.config.js --project=desktop --workers=1

      - name: Build Linux AppImage and deb
        run: npm run build:linux-hnnx

      - name: Inspect Linux packages
        shell: bash
        run: |
          test -f dist/HNNX-0.1.15-x64.AppImage
          test -f dist/HNNX-0.1.15-x64.deb
          test -f dist/linux-unpacked/resources/app.asar.unpacked/source/onnx-graphsurgeon.py
          file dist/HNNX-0.1.15-x64.AppImage | grep 'x86-64'
          file dist/HNNX-0.1.15-x64.deb | grep 'Debian binary package'

  macos-desktop:
    name: macOS desktop smoke and package
    needs: quality
    if: needs.quality.outputs.github-host == 'true'
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install project dependencies
        run: npm run install

      - name: Run macOS Electron smoke test
        run: npx playwright test --config=test/playwright.config.js --project=desktop --workers=1

      - name: Build macOS arm64 DMG
        run: npm run build:mac-hnnx

      - name: Inspect macOS package
        shell: bash
        run: |
          test -f dist/HNNX-0.1.15-arm64.dmg
          hdiutil verify dist/HNNX-0.1.15-arm64.dmg

  windows-desktop:
    name: Windows desktop smoke and package
    needs: quality
    if: needs.quality.outputs.github-host == 'true'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install project dependencies
        run: npm run install

      - name: Run Windows Electron smoke test
        run: npx playwright test --config=test/playwright.config.js --project=desktop --workers=1

      - name: Build Windows x64 installer
        run: npm run build:windows-hnnx

      - name: Inspect Windows package
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/HNNX-0.1.15-x64-setup.exe')) {
            throw 'Windows installer was not created.'
          }
          $header = [System.IO.File]::ReadAllBytes('dist/HNNX-0.1.15-x64-setup.exe')[0..1]
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw 'Windows installer does not have a PE executable header.'
          }
