name: HNNX CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm run install

      - name: Install Python quality tools
        run: python3 -m pip install ruff==0.16.1

      - name: Run JavaScript and Python static analysis
        run: npm run lint

      - name: Run VS Code extension tests
        run: npm --prefix vscode-extension test

      - name: Build browser application
        run: node package.js build web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run HNNX browser regression tests
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/hnnx-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npx playwright test --config=test/aimet.playwright.config.js --workers=1

  vscode-package:
    name: VS Code package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install project dependencies
        run: npm run install

      - name: Build VSIX
        run: npm run build:vscode-hnnx

      - name: Inspect VSIX
        shell: bash
        run: |
          test -f vscode-extension/hnnx-0.1.14.vsix
          unzip -t vscode-extension/hnnx-0.1.14.vsix
          unzip -p vscode-extension/hnnx-0.1.14.vsix extension/package.json | grep '"version": "0.1.14"'
          unzip -l vscode-extension/hnnx-0.1.14.vsix | grep 'extension/media/icon.png'

  linux-desktop:
    name: Linux desktop smoke and package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm run install

      - name: Install Electron test dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Electron desktop smoke test
        shell: bash
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_DISABLE_GPU: '1'
        run: xvfb-run -a npx playwright test --config=test/playwright.config.js --project=desktop --workers=1

      - name: Build Linux AppImage and deb
        run: npm run build:linux-hnnx

      - name: Inspect Linux packages
        shell: bash
        run: |
          test -f dist/HNNX-0.1.14-x64.AppImage
          test -f dist/HNNX-0.1.14-x64.deb
          test -f dist/linux-unpacked/resources/app.asar.unpacked/source/onnx-graphsurgeon.py
          file dist/HNNX-0.1.14-x64.AppImage | grep 'x86-64'
          file dist/HNNX-0.1.14-x64.deb | grep 'Debian binary package'
